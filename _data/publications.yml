# Publications — every paper on the site comes from this file.
# Shown on /publications/ (grouped by year, preprints first); the newest published
# papers also appear on the home page.
#
# To add a paper, copy a block below to the TOP of the list and fill it in.
# Only title and authors are required. Delete any line you don't need.
#
# Published paper:
#
# - title: "Paper title"
#   authors: "First Author*, Second Author*, A V Subramanyam"   # * = equal contribution (note is added automatically)
#   venue: "European Conference on Computer Vision (ECCV)"
#   short: "ECCV"                                # small badge next to the title
#   year: 2026
#   month: Oct                                   # optional; used in the BibTeX entry
#   type: conference                             # conference | journal | preprint (lowercase)
#   award: "Best Paper Award"                    # optional
#   presentation: Oral                           # optional: Oral | Poster | Spotlight
#   status: accepted                             # optional: "accepted" shows "to appear" until it is published
#   summary: "One sentence in plain language."   # optional, shown under the title
#   abstract: "The full abstract."               # optional, shown behind an "Abstract" button
#   topics: [adversarial]                        # ids from _data/topics.yml
#   links:
#     pdf: /downloads/my_paper.pdf               # file placed in the downloads/ folder, or a full URL
#     doi: 10.1109/ICIP.2026.1234567             # just the DOI, no https://doi.org/
#     arxiv: https://arxiv.org/abs/2601.01234
#     code: https://github.com/Visual-Conception-Group/repo
#     project: https://example.org/project-page
#     slides: /downloads/my_slides.pdf
#     poster: /downloads/my_poster.pdf
#     video: https://www.youtube.com/watch?v=...
#     url: https://example.org/paper             # any other link
#   bibkey: singh2026paper                       # optional citation key for the generated BibTeX
#   bibtex: |                                    # optional; without it a BibTeX entry is generated
#     @inproceedings{key2026,
#       title = {...},
#     }
#
# Preprint or paper under review (shown in its own "Preprints" group):
#
# - title: "Paper title"
#   authors: "First Author, A V Subramanyam"
#   type: preprint
#   status: "Under review"                       # optional label, e.g. "Under review", "Submitted"
#   year: 2026                                   # optional
#   topics: [adversarial]
#   links:
#     arxiv: https://arxiv.org/abs/2601.01234    # optional
#
# When a preprint is accepted: change type to conference or journal, add venue/short/year,
# and either remove status or set it to accepted.
