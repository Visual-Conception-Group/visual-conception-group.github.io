# Open positions — shown under "Open positions" on the Join us page (/join/).
#
# There are none right now, so the page says so. To advertise one, copy the template below,
# remove the "# " at the start of its lines, and fill it in. Only title and description are
# required. Each position also gets job-posting data, so it can show up in Google's job search
# (that needs `posted`).
#
# After the deadline the position is hidden the next time the site is rebuilt. Delete it once
# it is filled. It's worth adding a news item (_data/news.yml) as well.
#
# - title: "Research Assistant: text-based person re-identification"
#   type: Research Assistant            # e.g. Research Assistant | JRF | PhD | Postdoc | Intern
#   project: "DST-CRG project on ..."   # optional: the funded project
#   posted: 2026-10-15                  # date it was advertised (YYYY-MM-DD)
#   deadline: 2026-11-30                # optional: last day to apply (YYYY-MM-DD)
#   start: Immediately                  # optional
#   duration: 1 year, extendable        # optional
#   stipend: As per institute norms     # optional
#   employment: FULL_TIME               # optional, for job search: FULL_TIME | PART_TIME | INTERN | TEMPORARY | CONTRACTOR
#   description: >-                     # what the person will work on (Markdown allowed)
#     The selected candidate will work on object re-identification using natural language.
#   requirements:                       # optional list (Markdown allowed)
#     - A bachelor's or master's degree in computer science, electronics or a related field
#     - Strong Python programming; hands-on experience with PyTorch
#   subject: RA application             # optional: email subject; default "Application: <title>"
#   apply_url: https://forms.example    # optional: the Apply button opens this link instead of an email
#   apply: >-                           # optional: replaces the default "email your CV" instructions
#     Fill in the online form and upload your CV.
#   advert: /downloads/ra-advert.pdf    # optional: the full advertisement (PDF in downloads/, or a URL)
