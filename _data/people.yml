# People — everyone on the Team page, current members and alumni.
#
# role:    faculty | postdoc | phd | masters | bachelors | ra
# status:  current | alumni
# program: optional, shown instead of the generic role, e.g. "MTech (Research)", "MTech", "BTech"
# Sections on the Team page are listed in _data/team_sections.yml.
# Photos go in images/teampic/ (square-ish, about 400×400 px). Without a photo, initials are shown.
#
# - name: Full Name
#   url: https://homepage-or-linkedin            # optional
#   role: phd
#   status: current
#   since: 2026                                  # year joined
#   program: MTech (Research)                    # optional, for master's and bachelor's students
#   photo: fullname.jpg                          # optional
#   title: Professor                             # faculty only: job title
#   pi: true                                     # faculty only: shows "PI" on the home page
#   email: name@iiitd.ac.in                      # optional; shown on faculty cards only
#   scholar: https://scholar.google.com/citations?user=...   # optional Google Scholar profile
#   aliases: ["F. Name"]                         # other spellings used in author lists, so they get bolded
#   education: ["BTech (CSE), Some University"]  # optional
#
# Current master's or bachelor's student (photo optional; initials are shown without one):
#
# - name: Full Name
#   url: https://www.linkedin.com/in/...
#   role: masters                                # or bachelors
#   program: MTech (Research)
#   status: current
#   since: 2026
#   thesis: "Thesis topic"                       # optional
#
# When someone graduates, change status to alumni and add:
#   until: 2030
#   thesis: "Thesis title"
#   now: "Current position"
#   note: "Co-supervised by ..."                 # optional one-line remark
#
# One person per entry: list project partners as separate entries with the same thesis.

