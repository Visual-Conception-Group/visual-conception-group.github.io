<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <p class="footer-title">{{ site.title }}</p>
      <p>Part of the <a href="{{ site.institute.url }}">{{ site.institute.name }}</a>.</p>
    </div>
    <address class="footer-contact">
      {%- for line in site.contact.address %}
      {{ line }}<br>
      {%- endfor %}
      <a href="{{ site.contact.map }}">Open in Maps</a>
    </address>
    <ul class="footer-links">
      <li><a href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a></li>
      <li><a href="{{ site.links.scholar }}">Google Scholar</a></li>
      <li><a href="{{ site.links.github }}">GitHub</a></li>
    </ul>
  </div>
  <div class="wrap">
    <div class="footer-base">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
      <span>Built with Jekyll on GitHub Pages</span>
    </div>
  </div>
</footer>
